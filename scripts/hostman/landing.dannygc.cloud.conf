# landing.dannygc.cloud — Portal Biz product gallery (was missing DNS/vhost)
server {
    listen 80;
    listen [::]:80;
    server_name landing.dannygc.cloud;
    root /opt/portal-biz/public;
    index landing.html index.html;
    client_max_body_size 16m;

    location = / {
        try_files /landing.html =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4400/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /landing.html;
    }
}
