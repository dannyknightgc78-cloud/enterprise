# landing.dannygc.cloud — Portal Biz marketing homepage (black & gold)
# Gallery: portalbiz.cloudsit.app/public/landing.html | Suite: portalbiz.cloudsit.app/
server {
    listen 80;
    listen [::]:80;
    server_name landing.dannygc.cloud;
    client_max_body_size 32m;

    location = / {
        root /opt/portal-biz/public;
        rewrite ^ /home-landing.html break;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
