# landing.dannygc.cloud — Portal Biz homepage (same app as portalbiz.cloudsit.app)
# Not the /public/landing.html gallery — that stays on portalbiz.cloudsit.app/public/landing.html
server {
    listen 80;
    listen [::]:80;
    server_name landing.dannygc.cloud;
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
