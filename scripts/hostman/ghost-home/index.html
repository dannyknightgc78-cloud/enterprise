<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ghost Home</title>
  <style>
    :root { --bg: #070b14; --gold: #c9a962; --fg: #e8eefc; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: radial-gradient(900px 500px at 20% 0%, #141c2e, var(--bg));
      color: var(--fg);
    }
    main { text-align: center; padding: 2rem; max-width: 36rem; }
    h1 { font-size: 2rem; letter-spacing: 0.08em; color: var(--gold); margin: 0 0 0.5rem; }
    p { opacity: 0.85; line-height: 1.6; }
    .badge {
      display: inline-block; margin-top: 1rem; padding: 0.35rem 0.75rem;
      border: 1px solid var(--gold); border-radius: 999px; color: var(--gold); font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Ghost Home</h1>
    <p>Personal edge dashboard — served from Hostman when Mac home-edge is offline.</p>
    <span class="badge">hostman-fallback</span>
  </main>
</body>
</html>
