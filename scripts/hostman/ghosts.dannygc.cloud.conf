# ghosts.dannygc.cloud — Ghost Home (Hostman fallback when Mac home-edge is down)
server {
  listen 80;
  listen [::]:80;
  server_name ghosts.dannygc.cloud;
  root /var/www/ghost-home;
  index index.html;

  location = /api/health {
    default_type application/json;
    alias /var/www/ghost-home/health.json;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
